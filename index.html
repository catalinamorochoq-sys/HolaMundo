
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Mi primer software</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f6;
            text-align: center;
            padding: 60px 20px;
        }

        h1 {
            color: #be185d;
        }

        button {
            background-color: #db2777;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>¡Hola, mundo!</h1>

    <p>Estoy aprendiendo a desarrollar software.</p>

    <button onclick="saludar()">
        Haz clic aquí
    </button>

    <script>
        function saludar() {
            alert("¡Mi primera aplicación funciona!");
        }
    </script>
</body>
</html>
